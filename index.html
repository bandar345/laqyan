<meta charset="UTF-8">
<title>لقيان</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Language (ar / en) and direction before first paint (default: Arabic, RTL).
  (function(){ var l = 'ar'; try{ l = localStorage.getItem('laqyan-lang') || 'ar'; }catch(e){}
    if(l !== 'en') l = 'ar';
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'en' ? 'ltr' : 'rtl'); })();
  // Apply the saved light/dark choice before first paint (default: dark).
  (function(){ var m = 'dark'; try{ m = localStorage.getItem('laqyan-mode') || 'dark'; }catch(e){}
    document.documentElement.setAttribute('data-mode', m === 'light' ? 'light' : 'dark'); })();
  // Signed-in role, kept for this browser tab only (a new visit asks to sign in again).
  (function(){ try{ var r = sessionStorage.getItem('laqyan-role');
    if((r === 'student' || r === 'admin') && sessionStorage.getItem('laqyan-user'))
      document.documentElement.setAttribute('data-role', r); }catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Two themes, switched by html[data-mode]. Components use tokens only. */
  :root{
    color-scheme: dark;
    --bg: #05060F;
    --card: #0A0B1E;
    --card-2: #0E1026;
    --line: rgba(255,255,255,.06);
    --line-2: rgba(255,255,255,.10);
    --title: #FFFFFF;
    --text: #F4F5FA;
    --text-2: #C4C8DA;
    --muted: #8A90A8;
    --faint: #5D6380;
    --indigo: #4C63F5;
    --indigo-2: #6B7DFF;
    --indigo-soft: #B9C2FF;
    --mint: #5FD6B8;
    --coral: #F2724B;
    --amber: #F5B94A;
    --grad: linear-gradient(180deg, #6B7DFF 0%, #4C63F5 100%);
    --ring: 0 0 0 3px rgba(76,99,245,.32);
    --hover: rgba(255,255,255,.04);
    --active: rgba(255,255,255,.08);
    --btn-2: #15172B;
    --btn-2-hover: #1C1F38;
    --chip-bg: rgba(255,255,255,.03);
    --shell-line: rgba(255,255,255,.08);
    --shell-shadow: 0 50px 120px -40px rgba(4,5,20,.85);
    --thumb-base: #070818;
    --thumb-grid: rgba(255,255,255,.035);
    --thumb-glow: rgba(76,99,245,.6);
    --badge-bg: rgba(10,12,36,.85);
    --pill-bg: rgba(6,7,20,.78);
    --glass: rgba(8,9,24,.9);
    --pop-shadow: 0 24px 60px -18px rgba(0,0,0,.75);
    --toggle-on: rgba(255,255,255,.12);
    --backdrop-base: #161947;
    --backdrop-grid: rgba(255,255,255,.045);
    --backdrop: radial-gradient(120% 85% at 50% -10%, #A3AAEC 0%, #6068CB 32%, #2B2F78 66%, #13153D 100%);
    --dlg-backdrop: rgba(3,4,14,.72);
    --font: 'Geist', 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
  }
  :root[data-mode="light"]{
    color-scheme: light;
    --bg: #F2F4FB;
    --card: #FFFFFF;
    --card-2: #F5F7FD;
    --line: rgba(16,24,64,.08);
    --line-2: rgba(16,24,64,.13);
    --title: #0B1640;
    --text: #131A3A;
    --text-2: #3A4263;
    --muted: #5D6380;
    --faint: #8A90A8;
    --indigo-soft: #4C63F5;
    --mint: #138C70;
    --coral: #D4502A;
    --amber: #A96C06;
    --ring: 0 0 0 3px rgba(76,99,245,.22);
    --hover: rgba(16,24,64,.04);
    --active: rgba(76,99,245,.10);
    --btn-2: #EEF1FA;
    --btn-2-hover: #E3E7F7;
    --chip-bg: #F5F7FD;
    --shell-line: rgba(255,255,255,.8);
    --shell-shadow: 0 40px 100px -40px rgba(30,40,110,.45);
    --thumb-base: #EEF1FD;
    --thumb-grid: rgba(76,99,245,.07);
    --thumb-glow: rgba(107,125,255,.38);
    --badge-bg: #FFFFFF;
    --pill-bg: rgba(255,255,255,.92);
    --glass: rgba(255,255,255,.92);
    --pop-shadow: 0 24px 60px -20px rgba(20,30,90,.3);
    --toggle-on: #FFFFFF;
    --backdrop-base: #B9C0F2;
    --backdrop-grid: rgba(76,99,245,.09);
    --backdrop: radial-gradient(120% 85% at 50% -10%, #FFFFFF 0%, #DDE1FB 35%, #AEB6EF 72%, #8E97E4 100%);
    --dlg-backdrop: rgba(20,26,60,.38);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100vh;
    color:var(--text);
    font-family:var(--font);
    line-height:1.55;
    font-variant-numeric: tabular-nums;
    background-color:var(--backdrop-base);
    background-image:
      linear-gradient(var(--backdrop-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--backdrop-grid) 1px, transparent 1px),
      var(--backdrop);
    background-size:56px 56px, 56px 56px, 100% 100%;
    background-attachment:fixed;
  }
  h1,h2,h3,h4{text-wrap:balance; margin:0; font-weight:500;}
  p{margin:0;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:inherit;}
  ::selection{background:var(--indigo); color:#fff;}
  :focus-visible{outline:2px solid var(--indigo-2); outline-offset:2px;}

  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.001ms !important;}
  }

  /* ---------- Stage & shell ---------- */
  .stage{padding:32px 24px;}
  .app-shell{
    max-width:1380px; margin-inline:auto;
    background:var(--bg);
    border:1px solid var(--shell-line);
    border-radius:28px;
    box-shadow:var(--shell-shadow);
    padding:20px;
    display:grid; grid-template-columns:276px minmax(0,1fr); gap:20px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    display:flex; flex-direction:column; gap:14px;
    position:sticky; top:20px; align-self:start;
    min-height:calc(100vh - 106px);
  }
  .side-card{
    position:relative; overflow:hidden; background:var(--card);
    border:1px solid var(--line); border-radius:24px; padding:20px;
  }
  .brand-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:22px;}
  /* Logos sit directly on the card (no chip). */
  .logo-chip{background:transparent; display:inline-flex; align-items:center; justify-content:center;}
  /* KSU wordmark = white text on a black box. Dark: screen-blend drops the black.
     Light: invert (black text on white box) + multiply drops the white. */
  .logo-chip--wide{height:44px;}
  .logo-chip--wide img{height:44px; width:auto; mix-blend-mode:screen;}
  :root[data-mode="light"] .logo-chip--wide img{filter:invert(1); mix-blend-mode:multiply;}
  /* KSU shield = black line-art on transparency. */
  .site-footer .logo-chip img{filter:brightness(0) invert(1);}
  :root[data-mode="light"] .site-footer .logo-chip img{filter:brightness(0); opacity:.75;}

  .theme-toggle{
    display:inline-flex; gap:2px; padding:3px; border-radius:99px; flex:none;
    background:var(--card-2); border:1px solid var(--line-2);
  }
  .theme-btn{
    width:32px; height:32px; border-radius:50%; border:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--muted);
    transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .theme-btn svg{width:17px; height:17px;}
  .theme-btn:hover{color:var(--title);}
  .theme-btn.active{background:var(--toggle-on); color:var(--title); box-shadow:0 1px 3px rgba(0,0,0,.18);}

  .eyebrow{
    font-family:'Geist', sans-serif; font-size:11.5px; font-weight:500; letter-spacing:.14em;
    color:var(--muted); text-transform:uppercase; margin-bottom:6px; direction:ltr; text-align:right;
  }
  .brand-card h1{font-size:30px; font-weight:700; color:var(--title); line-height:1.2; font-family:'IBM Plex Sans Arabic', sans-serif;}
  .brand-card h1 .app-logo{height:52px; width:auto; margin-inline-start:-3px;}
  .app-logo--light{display:none;}
  :root[data-mode="light"] .app-logo--dark{display:none;}
  :root[data-mode="light"] .app-logo--light{display:block;}
  .brand-card .tagline{margin-top:4px; font-size:13.5px; color:var(--muted);}

  .nav-label{font-size:12px; color:var(--faint); margin:0 6px 10px; font-weight:500;}

  /* Section switch (male / female students) */
  .seg{
    display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px;
    border-radius:14px; background:var(--card-2); border:1px solid var(--line);
  }
  .seg-btn{
    border:0; background:transparent; cursor:pointer; padding:10px 6px; border-radius:10px;
    font-size:13.5px; font-weight:500; color:var(--text-2); white-space:nowrap;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .seg-btn:hover{color:var(--title);}
  .seg-btn .seg-count{font-family:'Geist', sans-serif; font-size:12px; opacity:.75;}
  .seg-btn.active{
    background:var(--grad); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 8px 20px -10px rgba(76,99,245,.8);
  }

  .tabs{display:flex; flex-direction:column; gap:4px;}
  .tab-btn{
    border:none; background:transparent; width:100%;
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:14px;
    font-size:15px; font-weight:500; color:var(--text-2); cursor:pointer; text-align:start;
    transition:background .2s ease, color .2s ease;
  }
  .tab-btn:hover{background:var(--hover); color:var(--title);}
  .tab-btn .nav-ico{width:20px; height:20px; flex:none;}
  .tab-btn#tabLost .nav-ico{color:var(--coral);}
  .tab-btn#tabFound .nav-ico{color:var(--mint);}
  .tab-btn .count{
    margin-inline-start:auto; font-family:'Geist', sans-serif; font-size:12.5px; font-weight:500;
    min-width:28px; text-align:center; padding:2px 8px; border-radius:99px;
    border:1px solid var(--line-2); color:var(--muted);
  }
  .tab-btn.active{background:var(--active); color:var(--title);}
  .tab-btn.active .count{background:var(--indigo); border-color:transparent; color:#fff;}

  .side-cta{
    margin-top:auto; width:100%; text-align:start; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    padding:16px 18px; border-radius:20px;
    border:1px solid rgba(160,172,255,.35);
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(140,155,255,.45), transparent 55%),
      linear-gradient(135deg, #1B2585 0%, #3246D6 55%, #5B6CF7 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 16px 40px -18px rgba(76,99,245,.9);
    transition:filter .2s ease, transform .2s ease;
  }
  .side-cta:hover{filter:brightness(1.08);}
  .side-cta:active{transform:translateY(1px);}
  .side-cta svg{width:22px; height:22px; flex:none; color:#fff;}
  .side-cta strong{display:block; font-size:15px; font-weight:600; color:#fff;}
  .side-cta span{display:block; font-size:12.5px; color:rgba(255,255,255,.75);}

  /* ---------- Main ---------- */
  .main{min-width:0; display:flex; flex-direction:column; gap:18px;}
  .topbar{display:flex; flex-wrap:wrap; align-items:center; gap:12px;}
  .filters{display:flex; flex-wrap:nowrap; gap:10px; flex:1 1 0; min-width:0;}
  @media (max-width:1240px){ .filters{flex-wrap:wrap; flex-basis:100%;} }
  .top-actions{display:flex; gap:10px; flex:none;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:44px; padding:0 18px; border-radius:12px; border:1px solid transparent;
    font-size:14.5px; font-weight:500; cursor:pointer; white-space:nowrap;
    transition:background .2s ease, border-color .2s ease, box-shadow .2s ease, filter .2s ease, transform .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn svg{width:18px; height:18px; flex:none;}
  .btn-primary{
    background:var(--grad); color:#fff; border-color:rgba(160,172,255,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 10px 26px -10px rgba(76,99,245,.8);
  }
  .btn-primary:hover{filter:brightness(1.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 12px 32px -8px rgba(107,125,255,.9);}
  .btn-outline{background:var(--btn-2); color:var(--title); border-color:var(--line-2);}
  .btn-outline:hover{background:var(--btn-2-hover); border-color:rgba(107,125,255,.4);}
  .btn-ghost{background:transparent; color:var(--text-2); border-color:var(--line-2);}
  .btn-ghost:hover{background:var(--hover); color:var(--title);}
  .btn-sm{height:38px; padding:0 14px; font-size:13.5px;}
  .btn-sm svg{width:16px; height:16px;}
  .btn-block{width:100%;}

  .search-field{position:relative; flex:1 1 240px; min-width:200px;}
  .search-field svg{
    position:absolute; inset-inline-start:14px; top:50%; translate:0 -50%;
    width:18px; height:18px; color:var(--muted); pointer-events:none;
  }
  .search-field input, select.filter-select{
    height:44px; border:1px solid var(--line-2); border-radius:12px;
    background:var(--card); color:var(--text);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .search-field input{width:100%; padding:0 14px; padding-inline-start:42px;}
  select.filter-select, .field select{
    appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 256 256' fill='%238A90A8'><path d='M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z'/></svg>");
    background-repeat:no-repeat; background-position:left 14px center;
  }
  select.filter-select{padding:0 14px; padding-inline-end:36px; flex:0 1 150px; min-width:120px;}
  @media (max-width:1240px){ select.filter-select{flex:1 1 150px;} }
  option{background:var(--card-2); color:var(--text);}
  input::placeholder, textarea::placeholder{color:var(--faint);}
  .search-field input:focus-visible, select.filter-select:focus-visible,
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible{
    outline:none; border-color:var(--indigo-2); box-shadow:var(--ring);
  }

  .results-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-inline:4px;}
  .results-meta{font-size:13px; color:var(--muted);}
  .results-meta strong{color:var(--text-2); font-weight:500;}

  /* Download report menu */
  .report-wrap{position:relative;}
  .report-menu{
    position:absolute; top:calc(100% + 8px); inset-inline-end:0; z-index:25;
    min-width:250px; padding:6px; border-radius:14px;
    background:var(--card); border:1px solid var(--line-2); box-shadow:var(--pop-shadow);
    display:none;
  }
  .report-menu.open{display:block; animation:pop .18s ease;}
  .menu-item{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    text-align:start; cursor:pointer; color:var(--text);
  }
  .menu-item:hover, .menu-item:focus-visible{background:var(--hover);}
  .menu-item svg{width:20px; height:20px; flex:none; color:var(--indigo-soft);}
  .menu-item strong{display:block; font-size:14px; font-weight:500; color:var(--title);}
  .menu-item span{display:block; font-size:12px; color:var(--muted);}

  /* ---------- Grid & cards ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:18px;}
  .card{
    position:relative; overflow:hidden; width:100%;
    display:flex; flex-direction:column; gap:14px; padding:18px;
    text-align:start; cursor:pointer; font:inherit; color:inherit;
    background:radial-gradient(70% 40% at 50% 0%, rgba(76,99,245,.10), transparent 70%), var(--card);
    border:1px solid var(--line); border-radius:24px;
    transition:border-color .25s ease, box-shadow .3s ease, background .3s ease, transform .25s ease;
    animation:rise .45s cubic-bezier(.2,.7,.2,1) both;
    animation-delay:calc(var(--i, 0) * 40ms);
  }
  /* Border spotlight: a glowing ring around the whole box, lit around the pointer
     (--mx/--my set in JS). At rest it sits at top-center, like a soft top-edge highlight. */
  @property --mx{syntax:'<length-percentage>'; inherits:true; initial-value:50%;}
  @property --my{syntax:'<length-percentage>'; inherits:true; initial-value:0%;}
  @property --ga{syntax:'<number>'; inherits:true; initial-value:.6;}
  @property --gw{syntax:'<length>'; inherits:true; initial-value:150px;}
  .card::before, .side-card::before, dialog::before, .gate-card::before, .kpi::before, .panel::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
    pointer-events:none; z-index:3;
    background:radial-gradient(circle var(--gw) at var(--mx) var(--my),
      rgba(140,158,255,var(--ga)) 0%, rgba(107,125,255,calc(var(--ga) * .55)) 40%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    transition:--mx .18s ease-out, --my .18s ease-out, --ga .3s ease, --gw .3s ease;
  }
  /* Soft inner light that trails the pointer. */
  .card::after, .side-card::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
    background:radial-gradient(circle 220px at var(--mx) var(--my), rgba(76,99,245,calc((var(--ga) - .6) * .3)), transparent 70%);
    transition:--mx .18s ease-out, --my .18s ease-out, --ga .3s ease;
  }
  /* Own stacking context: the inner light (z -1) paints above the box's fill but under its content,
     and the logo's blend mode still blends with the card fill. */
  .side-card, .card{isolation:isolate;}
  .card:hover{
    border-color:rgba(107,125,255,.42);
    box-shadow:0 0 0 1px rgba(107,125,255,.14), 0 20px 50px -22px rgba(76,99,245,.7);
    transform:translateY(-2px);
  }
  .card:focus{
    outline:none;
    background:linear-gradient(180deg, rgba(76,99,245,.18) 0%, rgba(76,99,245,.03) 65%), var(--card);
    border-color:rgba(107,125,255,.55);
  }
  .card:focus-visible{box-shadow:var(--ring);}

  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .card-title{display:block; font-size:16.5px; font-weight:500; color:var(--title); line-height:1.4;}
  .card-cat{display:block; margin-top:3px; font-size:12.5px; color:var(--muted);}
  .arrow-btn{
    width:34px; height:34px; flex:none; border-radius:10px;
    border:1px solid var(--line-2); color:var(--text-2);
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .arrow-btn svg{width:16px; height:16px; transform:scaleX(-1);}
  .card:hover .arrow-btn{border-color:rgba(107,125,255,.55); color:var(--title); background:rgba(76,99,245,.12);}

  .card-thumb, .detail-thumb{
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:16px;
    background:
      radial-gradient(90% 120% at 50% 125%, var(--thumb-glow) 0%, rgba(76,99,245,.12) 45%, transparent 72%),
      linear-gradient(var(--thumb-grid) 1px, transparent 1px) 0 0 / 22px 22px,
      linear-gradient(90deg, var(--thumb-grid) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--thumb-base);
  }
  .card-thumb{height:136px; flex:none;}
  .card-thumb img, .detail-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  /* Product illustrations: centred on the grid, with a soft lift */
  .card-thumb img.illus, .detail-thumb img.illus{
    object-fit:contain; padding:6px 10px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));
    transition:transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .detail-thumb img.illus{padding:12px 18px;}
  :root[data-mode="light"] .card-thumb img.illus, :root[data-mode="light"] .detail-thumb img.illus{filter:drop-shadow(0 10px 14px rgba(30,40,110,.18));}
  .card:hover .card-thumb img.illus{transform:scale(1.05) translateY(-2px);}
  .card-thumb{height:150px;}
  .icon-badge{
    position:relative; width:58px; height:58px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--badge-bg); color:var(--indigo-soft);
    border:1px solid rgba(122,140,255,.45);
    box-shadow:0 0 0 6px rgba(76,99,245,.08), 0 0 38px rgba(76,99,245,.45);
  }
  .icon-badge svg{width:26px; height:26px;}

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600; line-height:1; padding:5px 9px; border-radius:8px;
    border:1px solid; background:var(--pill-bg); backdrop-filter:blur(6px);
  }
  .card-thumb .status-pill, .detail-thumb .status-pill{position:absolute; top:10px; inset-inline-start:10px;}
  .status-pill.lost{color:var(--amber); border-color:rgba(245,185,74,.55);}
  .status-pill.found{color:var(--mint); border-color:rgba(95,214,184,.55);}
  .status-pill.delivered{color:var(--indigo-soft); border-color:rgba(122,140,255,.55);}

  .card-desc{
    font-size:13.5px; color:var(--muted); line-height:1.65;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .card-meta{
    margin-top:auto; padding-top:12px; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-2);
  }
  .card-meta-row{display:flex; align-items:center; gap:7px;}
  .card-meta-row svg{width:15px; height:15px; flex:none; color:var(--faint);}
  .card-meta-row .ago{color:var(--muted);}

  .empty-state{
    grid-column:1/-1; text-align:center; padding:64px 20px; color:var(--muted);
    border:1px dashed var(--line-2); border-radius:24px; background:var(--card);
    animation:rise .4s ease both;
  }
  .empty-state svg{width:48px; height:48px; color:var(--indigo-soft); margin-bottom:14px;}
  .empty-state h3{font-size:17px; color:var(--title); margin-bottom:6px;}
  .empty-state p{font-size:13.5px; margin-bottom:18px;}

  .site-footer{
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:18px 8px 6px; color:var(--faint); font-size:12.5px; text-align:center;
    border-top:1px solid var(--line);
  }
  .site-footer .logo-chip{height:26px;}
  .site-footer .logo-chip img{height:22px; width:auto;}
  .site-footer strong{color:var(--text-2); font-weight:500;}

  /* ---------- Dialogs ---------- */
  dialog{
    padding:0; width:min(580px, calc(100vw - 24px)); max-height:88vh; overflow:hidden;
    background:var(--card); color:var(--text);
    border:1px solid var(--line-2); border-radius:24px;
    box-shadow:0 40px 100px -30px rgba(0,0,0,.6), 0 0 0 1px rgba(76,99,245,.1);
  }
  dialog[open]{animation:pop .28s cubic-bezier(.2,.7,.2,1);}
  dialog::backdrop{background:var(--dlg-backdrop); backdrop-filter:blur(6px);}
  .modal-head{
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; border-bottom:1px solid var(--line); background:var(--card);
  }
  .modal-head h2{font-size:17px; font-weight:500; color:var(--title);}
  .icon-btn{
    width:36px; height:36px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:transparent; color:var(--text-2);
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .icon-btn:hover{background:var(--hover); color:var(--title); border-color:rgba(107,125,255,.4);}
  .icon-btn svg{width:18px; height:18px;}
  .modal-body{padding:22px; overflow-y:auto; max-height:calc(88vh - 74px);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:500; margin-bottom:7px; color:var(--muted);}
  .field .hint{font-size:12px; color:var(--faint); margin-top:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:12px;
    border:1px solid var(--line-2); background-color:var(--card-2); color:var(--text);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field select{padding-inline-end:38px;}
  .field textarea{resize:vertical; min-height:84px;}
  .field.err input, .field.err select, .field.err textarea{border-color:var(--coral);}
  .field .err-msg{display:none; color:var(--coral); font-size:12px; margin-top:6px;}
  .field.err .err-msg{display:block;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}
  /* ---------- Entry screen (student / admin) ---------- */
  .gate{position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:20px; overflow-y:auto;}
  :root[data-role="student"] .gate, :root[data-role="admin"] .gate{display:none;}
  :root:not([data-role="student"]):not([data-role="admin"]) .stage,
  :root:not([data-role="student"]):not([data-role="admin"]) .mobile-cta{display:none;}
  .gate-card{
    position:relative; isolation:isolate; overflow:hidden;
    width:min(460px, 100%); padding:34px 28px 20px; text-align:center;
    background:var(--card); border:1px solid var(--line-2); border-radius:28px;
    box-shadow:var(--shell-shadow); animation:pop .45s cubic-bezier(.2,.7,.2,1);
  }
  .gate-logo{height:64px; width:auto; margin:0 auto 18px;}
  .gate-card h1{font-size:23px; font-weight:700; color:var(--title); font-family:'IBM Plex Sans Arabic', sans-serif;}
  .gate-sub{margin-top:6px; margin-bottom:22px; font-size:14px; color:var(--muted);}
  .gate-step{display:flex; flex-direction:column; gap:10px; text-align:start;}
  .gate-step[hidden]{display:none;}
  .role-card{
    display:flex; align-items:center; gap:14px; width:100%; padding:16px; cursor:pointer; text-align:start;
    border-radius:18px; border:1px solid var(--line-2); background:var(--card-2);
    transition:border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .role-card:hover{border-color:rgba(107,125,255,.55); background:var(--active); transform:translateY(-1px); box-shadow:0 14px 30px -18px rgba(76,99,245,.8);}
  .role-ico{
    width:48px; height:48px; flex:none; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:rgba(76,99,245,.14); color:var(--indigo-soft); border:1px solid rgba(122,140,255,.3);
  }
  .role-ico svg{width:24px; height:24px;}
  .role-text strong{display:block; font-size:16px; font-weight:600; color:var(--title);}
  .role-text small{display:block; margin-top:2px; font-size:12.5px; color:var(--muted);}
  .role-arrow{width:18px; height:18px; flex:none; margin-inline-start:auto; color:var(--faint); transition:transform .2s ease, color .2s ease;}
  .role-card:hover .role-arrow{color:var(--indigo-soft); transform:translateX(-3px);}
  .gate-foot{
    margin-top:22px; padding-top:14px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:10px; font-size:12px; color:var(--faint);
  }
  .gate-foot .logo-chip--wide, .gate-foot .logo-chip--wide img{height:30px;}

  /* Role badge in the sidebar + what each role sees */
  .role-bar{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .role-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:99px; border:1px solid var(--line-2); color:var(--text-2); background:var(--chip-bg);
  }
  .role-badge svg{width:14px; height:14px;}
  :root[data-role="admin"] .role-badge{background:var(--grad); color:#fff; border-color:transparent;}
  .link-btn{
    display:inline-flex; align-items:center; gap:5px; border:0; background:none; padding:4px 2px; cursor:pointer;
    font-size:12.5px; color:var(--muted); border-radius:6px;
  }
  .link-btn svg{width:15px; height:15px;}
  .link-btn:hover{color:var(--title);}
  :root[data-role="student"] .report-wrap{display:none;}

  /* Admin-only actions in the detail popup */
  .admin-actions{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line-2);}
  .admin-actions .admin-lbl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-bottom:10px;}
  .admin-actions .admin-lbl svg{width:14px; height:14px; color:var(--indigo-soft);}
  .admin-actions .confirm-text{font-size:13.5px; color:var(--text); margin-bottom:10px;}
  /* Possible matches */
  .card-meta-row.match-hint{color:var(--indigo-soft); font-weight:500;}
  .card-meta-row.match-hint svg{color:var(--indigo-soft);}
  .matches{
    margin-bottom:16px; padding:14px; border-radius:16px;
    border:1px solid rgba(122,140,255,.35); background:rgba(76,99,245,.07);
  }
  .matches-head{display:flex; align-items:center; gap:8px; color:var(--indigo-soft);}
  .matches-head svg{width:18px; height:18px; flex:none;}
  .matches-head strong{font-size:14.5px; font-weight:600; color:var(--title);}
  .matches-count{
    margin-inline-start:auto; font-family:'Geist', sans-serif; font-size:12px; font-weight:600;
    min-width:24px; text-align:center; padding:1px 8px; border-radius:99px; background:var(--indigo); color:#fff;
  }
  .matches-note{font-size:12.5px; color:var(--muted); margin:4px 0 10px;}
  .match-row{
    display:flex; align-items:center; gap:12px; width:100%; padding:8px; margin-top:8px; cursor:pointer; text-align:start;
    border-radius:12px; border:1px solid var(--line); background:var(--card);
    transition:border-color .2s ease, background .2s ease;
  }
  .match-row:hover{border-color:rgba(107,125,255,.55); background:var(--active);}
  .match-thumb{
    width:56px; height:42px; flex:none; border-radius:10px; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center; background:var(--thumb-base); color:var(--indigo-soft);
  }
  .match-thumb img{width:100%; height:100%; object-fit:contain; padding:3px;}
  .match-thumb img.photo{object-fit:cover; padding:0;}
  .match-thumb svg{width:20px; height:20px;}
  .match-text{min-width:0; flex:1;}
  .match-text strong{display:block; font-size:13.5px; font-weight:500; color:var(--title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .match-text span{display:block; font-size:12px; color:var(--muted);}
  .match-row .status-pill{flex:none;}
  .match-chev{color:var(--faint); flex:none; display:flex;}
  .match-chev svg{width:16px; height:16px;}
  .meta-clear{margin-inline-start:8px; color:var(--indigo-soft); font-weight:500;}
  .meta-clear svg{width:13px; height:13px;}
  .dash-foot{
    grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:2px 4px; font-size:12.5px; color:var(--muted);
  }
  .dash-foot > span{display:flex; align-items:center; gap:6px;}
  .dash-foot > span svg{width:15px; height:15px; color:var(--indigo-soft); flex:none;}

  .admin-btns{display:flex; gap:10px; flex-wrap:wrap;}
  .admin-btns .btn{flex:1 1 180px;}
  .btn-return{background:rgba(76,99,245,.12); color:var(--indigo-soft); border-color:rgba(122,140,255,.5);}
  .btn-return:hover{background:rgba(76,99,245,.2);}
  .returned-box{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px;
    background:rgba(76,99,245,.1); border:1px solid rgba(122,140,255,.4); color:var(--indigo-soft);
  }
  .returned-box > svg{width:26px; height:26px; flex:none;}
  .returned-box strong{display:block; font-size:14.5px; font-weight:600; color:var(--title);}
  .returned-box span{display:block; font-size:12.5px; color:var(--muted);}

  /* Sidebar entry for the dashboard (admins only) */
  .nav-dash{margin-top:6px; border-top:1px solid var(--line); border-radius:0 0 14px 14px; padding-top:14px;}
  .nav-dash .nav-ico{color:var(--indigo-soft);}
  .nav-dash.active{border-top-color:transparent; border-radius:14px;}
  .admin-tag{margin-inline-start:auto; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; background:rgba(76,99,245,.14); color:var(--indigo-soft);}
  :root[data-role="student"] .nav-dash{display:none;}

  /* List view vs dashboard view */
  .dash{display:none;}
  .main[data-view="dash"] .topbar, .main[data-view="dash"] .grid{display:none;}
  .main[data-view="dash"] .dash{display:grid;}

  /* ---------- Admin dashboard ---------- */
  .dash{grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; animation:rise .4s ease both;}
  .kpis{grid-column:1/-1; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:14px;}
  .kpi, .panel{
    position:relative; overflow:hidden; isolation:isolate;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
  }
  .kpi{padding:16px 18px;}
  .kpi-lbl{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
  .kpi-lbl svg{width:16px; height:16px; flex:none;}
  .kpi-lbl .k-lost{color:var(--coral);} .kpi-lbl .k-found{color:var(--mint);} .kpi-lbl .k-ret{color:var(--indigo-soft);}
  .kpi-val{font-family:'Geist', sans-serif; font-size:32px; font-weight:500; color:var(--title); line-height:1.15; margin-top:8px;}
  .kpi-sub{font-size:12px; color:var(--faint); margin-top:2px;}
  .meter{height:6px; border-radius:99px; background:var(--line-2); margin-top:10px; overflow:hidden;}
  .meter > span{display:block; height:100%; border-radius:99px; background:var(--grad);}
  .panel{padding:20px; border-radius:24px;}
  .panel.wide{grid-column:1/-1;}
  .panel-head{margin-bottom:16px;}
  .panel-head h3{font-size:16px; font-weight:500; color:var(--title);}
  .panel-head p{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .bars{display:flex; flex-direction:column; gap:6px;}
  .bar-row{
    display:grid; grid-template-columns:minmax(96px, 150px) 1fr 34px; align-items:center; gap:12px;
    padding:6px 8px; margin-inline:-8px; border-radius:10px; font-size:13px; color:var(--text-2); cursor:default;
  }
  .bar-row:hover{background:var(--hover);}
  .bar-lbl{display:flex; align-items:center; gap:8px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-lbl svg{width:16px; height:16px; flex:none; color:var(--muted);}
  .bar-track{height:12px; display:flex;}
  /* Bar grows from the start (right in RTL); only the far end is rounded */
  .bar-fill{
    height:100%; min-width:3px; background:var(--indigo-2);
    border-start-end-radius:4px; border-end-end-radius:4px;
    transition:filter .2s ease;
  }
  :root[data-mode="light"] .bar-fill{background:var(--indigo);}
  .bar-row:hover .bar-fill{filter:brightness(1.15);}
  .bar-val{font-family:'Geist', sans-serif; font-weight:500; color:var(--title); text-align:end;}
  .dash-table-wrap{overflow-x:auto;}
  .dash-table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px;}
  .dash-table th{font-size:12px; font-weight:500; color:var(--muted); text-align:start; padding:8px 10px; border-bottom:1px solid var(--line-2);}
  .dash-table td{padding:12px 10px; border-bottom:1px solid var(--line); color:var(--text-2);}
  .dash-table tr:last-child td{border-bottom:0;}
  .dash-table td.num, .dash-table th.num{text-align:end; font-family:'Geist', sans-serif;}
  .dash-table td.num{color:var(--title); font-weight:500;}
  .dash-table td:first-child{color:var(--title); font-weight:500;}
  .chart-tip{
    position:fixed; z-index:95; pointer-events:none; opacity:0; transition:opacity .12s ease;
    padding:8px 12px; border-radius:10px; font-size:12.5px; line-height:1.5;
    background:var(--card-2); color:var(--text); border:1px solid var(--line-2); box-shadow:var(--pop-shadow);
  }
  .chart-tip.show{opacity:1;}
  .chart-tip b{color:var(--title); font-weight:600;}
  @media (max-width:1180px){ .kpis{grid-template-columns:repeat(3, minmax(0,1fr));} }
  @media (max-width:760px){
    .dash{grid-template-columns:1fr;}
    .kpis{grid-template-columns:repeat(2, minmax(0,1fr));}
    .kpi-val{font-size:26px;}
  }

  .btn-danger{background:rgba(242,114,75,.1); color:var(--coral); border-color:rgba(242,114,75,.45);}
  .btn-danger:hover{background:rgba(242,114,75,.18);}
  .btn-danger-solid{background:#DE5536; color:#fff; border-color:#DE5536;}
  .btn-danger-solid:hover{filter:brightness(1.08);}

  .admin-lock{
    width:56px; height:56px; margin:0 auto 12px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(76,99,245,.12); color:var(--indigo-soft); border:1px solid rgba(122,140,255,.35);
  }
  .admin-lock svg{width:26px; height:26px;}
  .admin-note{text-align:center; font-size:13.5px; color:var(--muted); margin-bottom:18px;}
  #adminPassword{text-align:center; letter-spacing:.3em; font-family:'Geist', sans-serif;}
  .form-actions{display:flex; gap:10px; margin-top:8px;}
  .form-actions .btn{flex:1;}

  .detail-thumb{aspect-ratio:16/8; margin-bottom:18px; border-radius:18px;}
  .detail-thumb .icon-badge{width:76px; height:76px;}
  .detail-thumb .icon-badge svg{width:34px; height:34px;}
  .detail-title-row h3{font-size:22px; font-weight:500; color:var(--title);}
  .detail-tags{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px;}
  .cat-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2);
    padding:5px 10px; border-radius:8px; border:1px solid var(--line-2); background:var(--chip-bg);
  }
  .cat-chip svg{width:14px; height:14px; color:var(--indigo-soft);}
  .detail-desc{font-size:14.5px; color:var(--muted); line-height:1.75; margin-bottom:18px;}
  .detail-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:18px;}
  .detail-item{background:var(--card-2); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .detail-item .lbl{font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .detail-item .lbl svg{width:14px; height:14px;}
  .detail-item .val{font-size:15px; font-weight:500; color:var(--title);}
  .contact-box{
    border:1px dashed rgba(122,140,255,.35); border-radius:16px; padding:16px; text-align:center; font-size:13px;
    background:radial-gradient(80% 120% at 50% 120%, rgba(76,99,245,.18), transparent 70%), var(--card-2);
  }
  .contact-lbl{display:flex; align-items:center; justify-content:center; gap:6px; color:var(--muted); margin-bottom:8px;}
  .contact-lbl svg{width:14px; height:14px;}
  .contact-reveal{
    font-family:'Geist', sans-serif; font-size:21px; font-weight:500; color:var(--indigo-soft);
    direction:ltr; unicode-bidi:plaintext; word-break:break-all; animation:rise .35s ease both;
  }
  .contact-note{font-size:12px; color:var(--faint); margin-top:8px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%; translate:-50% 12px; z-index:80;
    display:flex; align-items:center; gap:12px;
    padding:14px 18px; border-radius:16px;
    background:var(--card-2); color:var(--title); border:1px solid var(--line-2);
    font-size:14px; font-weight:500;
    box-shadow:var(--pop-shadow);
    opacity:0; pointer-events:none; transition:opacity .25s ease, translate .25s ease;
  }
  .toast.show{opacity:1; translate:-50% 0;}
  .toast .tick{
    width:26px; height:26px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:rgba(95,214,184,.16); color:var(--mint);
  }
  .toast .tick svg{width:15px; height:15px;}

  /* ---------- Mobile CTA bar ---------- */
  .mobile-cta{
    display:none; position:fixed; bottom:0; inset-inline:0; z-index:40;
    gap:10px; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--glass); backdrop-filter:blur(14px);
    border-top:1px solid var(--line-2);
  }

  /* ---------- Chat assistant (مساعد لقيان) ---------- */
  :root:not([data-role="student"]):not([data-role="admin"]) .chat-fab,
  :root:not([data-role="student"]):not([data-role="admin"]) .chat-panel{display:none;}
  .chat-fab{
    position:fixed; bottom:24px; inset-inline-end:24px; z-index:45;
    display:flex; align-items:center; gap:10px; height:54px; padding:0 20px 0 16px; border-radius:999px;
    border:1px solid rgba(160,172,255,.45); color:#fff; cursor:pointer; font-size:15px; font-weight:600;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(140,155,255,.45), transparent 55%),
      linear-gradient(135deg, #1B2585 0%, #3246D6 55%, #5B6CF7 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 18px 40px -14px rgba(76,99,245,.95);
    transition:filter .2s ease, transform .2s ease;
  }
  .chat-fab:hover{filter:brightness(1.08);}
  .chat-fab:active{transform:translateY(1px);}
  .chat-fab svg{width:24px; height:24px; flex:none;}
  .chat-fab[aria-expanded="true"]{display:none;}
  .chat-panel{
    position:fixed; bottom:24px; inset-inline-end:24px; z-index:60;
    width:min(400px, calc(100vw - 32px)); height:min(620px, calc(100vh - 48px));
    display:flex; flex-direction:column; overflow:hidden;

      en:{name:'University allowance card', desc:"A student's allowance card, found on the ground next to the main entrance gate in the morning."}}
  ].map(({art, ...it}) => ({...it, id:'seed-'+(uid++), illus:'assets/items/'+art+'.svg'}));

  // A few sample items already handed back to their owners, so the demo shows all three states.
  const SEED_RETURNED = {'seed-105':'2026-09-26', 'seed-102':'2026-09-25', 'seed-103':'2026-09-27', 'seed-108':'2026-09-24'};
  SEED.forEach(it => { if(SEED_RETURNED[it.id]){ it.returned = true; it.returnedDate = SEED_RETURNED[it.id]; } });
  const SEED_BY_ID = Object.fromEntries(SEED.map(i => [i.id, i]));

  // Reports are kept on this device (localStorage), so a refresh doesn't lose new reports, edits,
  // deletions or returns. Admins can restore the sample data from the dashboard.
  const STORE_KEY = 'laqyan-items-v1';
  function freshSeed(){ return SEED.map(i => ({...i})); }
  function loadItems(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if(Array.isArray(saved) && saved.every(i => i && i.id && i.type && i.section && i.name)){
        // Older saves predate the English texts: add them back for unedited sample items.
        saved.forEach(i => { const s = SEED_BY_ID[i.id]; if(s && !i.en && i.name === s.name) i.en = s.en; });
        return saved;
      }
    }catch(e){}
    return freshSeed();
  }
  function saveItems(){
    if(useDb) return true;                          // Supabase is the record; nothing to cache
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(items)); return true; }
    catch(e){ toast(t('toast.storageFull')); return false; }
  }
  // Backend: Supabase when configured (lib/supabaseClient.js), otherwise on-device storage.
  // `?backend=local` forces on-device mode (used by the automated UI tests).
  const sb = new URLSearchParams(location.search).get('backend') === 'local' ? null : (window.laqyanSupabase || null);
  const useDb = !!sb;
  let dbState = useDb ? 'loading' : 'ready';       // 'loading' | 'ready' | 'error'
  let lastLoad = 0;
  let items = useDb ? [] : loadItems();
  uid = Math.max(uid, ...items.map(i => +String(i.id).replace(/\D/g, '') || 0)) + 1;
  let currentTab = 'lost';
  let currentSection = 'male';

  /* ---- Supabase row <-> app item (columns: supabase/migrations/20260929120000_create_items.sql) ---- */
  function rowToItem(r){
    return {
      id: r.id, type: r.report_type, section: r.section,
      name: r.item_name, desc: r.description || '', category: r.category, location: r.location,
      date: r.item_date, contact: r.contact_info, image: r.image_url || '',
      illus: r.illustration ? 'assets/items/' + r.illustration + '.svg' : '',
      returned: r.status === 'returned', returnedDate: r.returned_date || undefined,
      en: r.name_en ? {name: r.name_en, desc: r.description_en || ''} : undefined
    };
  }
  function valuesToRow(v){
    return {section: v.section, item_name: v.name, category: v.category, description: v.desc,
            location: v.location, item_date: v.date, contact_info: v.contact, image_url: v.image || null};
  }
  // Load every report (newest first). `quiet` refreshes in the background without the spinner.
  async function loadFromDb(quiet){
    if(!quiet){ dbState = 'loading'; refreshViews(); }
    const {data, error} = await sb.from('items').select('*')
      .order('item_date', {ascending: false}).order('created_at', {ascending: false});
    if(error){
      console.error('LaqYan: loading reports failed', error);
      if(!quiet){ dbState = 'error'; refreshViews(); }
      return false;
    }
    items = data.map(rowToItem);
    dbState = 'ready'; lastLoad = Date.now();
    refreshViews();
    return true;
  }
  // Admin edit / delete / restore run as database functions that check the admin's name and
  // password against public.users; the details typed on the entry screen are kept for this tab only.
  let userLogin = '', adminPw = '';
  try{ userLogin = sessionStorage.getItem('laqyan-user') || ''; adminPw = sessionStorage.getItem('laqyan-admin-pw') || ''; }catch(e){}
  async function adminRpc(fn, args){
    const {data, error} = await sb.rpc(fn, Object.assign({p_admin_name: userLogin, p_password: adminPw}, args || {}));
    if(error){
      console.error('LaqYan: ' + fn + ' failed', error);
      toast(t(error.code === '28000' ? 'err.adminPw' : 'err.action'));
      return {ok: false};
    }
    return {ok: true, data};
  }

  /* ================================================================ Helpers */
  function todayISO(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(iso){
    try{
      return new Intl.DateTimeFormat(lang === 'en' ? 'en-GB' : 'ar', {day:'numeric', month:'long', year:'numeric', numberingSystem:'latn'})
        .format(new Date(iso+'T00:00:00'));
    }catch(e){ return iso; }
  }
  function daysAgo(iso){
    const diff = Math.round((new Date(todayISO()+'T00:00:00') - new Date(iso+'T00:00:00')) / 86400000);
    if(diff <= 0) return t('ago.today');
    if(diff === 1) return t('ago.1');
    if(diff === 2) return t('ago.2');
    return t(diff <= 10 ? 'ago.few' : 'ago.many', {n: diff});
  }
  function countItems(n){ return n === 1 ? t('sim.1') : n === 2 ? t('sim.2') : t('sim.n', {n}); }
  function resultsText(n){ return (lang === 'en' && n === 1) ? t('meta.result1') : t('meta.results', {n}); }
  // Saudi mobile (05xxxxxxxx, +9665…, 009665…; Arabic-Indic digits accepted) or an email address.
  function validContact(v){
    const s = v.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s-]/g, '');
    return /^(05\d{8}|(\+|00)9665\d{8})$/.test(s) || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
  }
  // Possible matches: the other list, same section + category, not yet returned.
  function matchesFor(it){
    if(it.returned) return [];
    const other = it.type === 'lost' ? 'found' : 'lost';
    return items.filter(o => o.type === other && !o.returned && o.section === it.section && o.category === it.category);
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function toast(msg){
    const el = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>el.classList.remove('show'), 2800);
  }

  /* ================================================================ Static text (data-i18n) */
  function applyStatic(){
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.alt = t(el.dataset.i18nAlt); });
    document.title = t('app.title');
  }

  /* ================================================================ Sign-in: student ID or admin name + password
     With Supabase the check runs in the database (public.login) against public.users.
     LOCAL_USERS is only for ?backend=local / no Supabase: it is visible in the page source. */
  const LOCAL_USERS = {
    student: {'443101234':'12345', '443105678':'12345', '444109876':'12345'},
    admin:   {'admin':'12345'}
  };
  const root = document.documentElement;
  function currentRole(){ return root.getAttribute('data-role'); }
  function isAdmin(){ return currentRole() === 'admin'; }
  function renderBadge(){
    const r = currentRole(); if(!r) return;
    const badge = document.getElementById('roleBadge');
    badge.innerHTML = svg(r === 'admin' ? 'shield' : 'grad') + esc(t(r === 'admin' ? 'badge.admin' : 'badge.student'));
    badge.title = userLogin;
  }

  const gateRoles = document.getElementById('gateRoles');
  const gateLogin = document.getElementById('gateLogin');
  const loginIdInput = document.getElementById('loginId');
  const loginPwInput = document.getElementById('loginPassword');
  const gateSub = document.getElementById('gateSub');
  let gateStep = 'roles';          // 'roles' | 'student' | 'admin'

  function clearLoginErr(){ document.getElementById('f-login').classList.remove('err'); document.getElementById('f-loginId').classList.remove('err'); }
  function showGateStep(step, focus){
    gateStep = step;
    const login = step !== 'roles', student = step === 'student';
    gateRoles.hidden = login;
    gateLogin.hidden = !login;
    gateSub.textContent = t(!login ? 'gate.sub' : student ? 'gate.subStudent' : 'gate.subAdmin');
    document.getElementById('loginIdLabel').textContent = t(student ? 'login.studentId' : 'login.adminName');
    loginIdInput.inputMode = student ? 'numeric' : 'text';
    loginIdInput.maxLength = student ? 9 : 60;
    clearLoginErr();
    if(focus === false) return;
    if(login){ loginIdInput.value = ''; loginPwInput.value = ''; loginIdInput.focus(); }
    else document.getElementById('roleStudent').focus();
  }
  function enterAs(role){
    root.setAttribute('data-role', role);
    try{ sessionStorage.setItem('laqyan-role', role); sessionStorage.setItem('laqyan-user', userLogin); }catch(e){}
    renderBadge();
    toggleReportMenu(false);
    setView('list');                           // cards/details depend on the role
    window.scrollTo(0, 0);
    toast(t(role === 'admin' ? 'toast.welcomeAdmin' : 'toast.welcomeStudent'));
    if(!openFromHash() && !tourSeen(role)) setTimeout(() => startTour(), 450);
  }
  function leave(){
    endTour(false);
    root.removeAttribute('data-role');
    try{ ['laqyan-role', 'laqyan-user', 'laqyan-admin-pw'].forEach(k => sessionStorage.removeItem(k)); }catch(e){}
    userLogin = ''; adminPw = '';
    resetChat();
    document.querySelectorAll('dialog[open]').forEach(d=>d.close());
    setView('list');
    showGateStep('roles');
  }

  document.getElementById('roleStudent').addEventListener('click', ()=>showGateStep('student'));
  document.getElementById('roleAdmin').addEventListener('click', ()=>showGateStep('admin'));
  document.getElementById('gateBack').addEventListener('click', ()=>showGateStep('roles'));
  document.getElementById('btnSwitchRole').addEventListener('click', leave);
  gateLogin.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const role = gateStep === 'student' ? 'student' : 'admin';
    const id = loginIdInput.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
    const pw = loginPwInput.value, errEl = document.getElementById('loginErr');
    const fail = (key, field) => {
      errEl.textContent = t(key);
      document.getElementById('f-login').classList.add('err');
      if(field) document.getElementById(field).classList.add('err');
    };
    clearLoginErr();
    if(!id || !pw){ fail('err.loginEmpty', !id ? 'f-loginId' : null); (id ? loginPwInput : loginIdInput).focus(); return; }
    let ok;
    if(useDb){
      // Checked inside Supabase (public.login); the browser never reads the users table.
      const btn = document.getElementById('gateSubmit');
      btn.disabled = true; btn.textContent = t('gate.checking');
      const {data, error} = await sb.rpc('login', {p_role: role, p_login: id, p_password: pw});
      btn.disabled = false; btn.textContent = t('btn.enter');
      if(error){ console.error('LaqYan: login failed', error); fail('err.network'); return; }
      ok = data === true;
    }else{
      const accounts = LOCAL_USERS[role];
      const key = role === 'admin' ? Object.keys(accounts).find(k => k.toLowerCase() === id.toLowerCase()) : id;
      ok = !!key && accounts[key] === pw;
    }
    if(!ok){ fail('err.login'); loginPwInput.select(); return; }
    userLogin = id;
    adminPw = role === 'admin' ? pw : '';
    try{ if(role === 'admin') sessionStorage.setItem('laqyan-admin-pw', pw); }catch(e2){}
    enterAs(role);
  });
  [loginIdInput, loginPwInput].forEach(el => el.addEventListener('input', clearLoginErr));

  /* ================================================================ Light / dark mode */
  function setMode(mode){
    root.setAttribute('data-mode', mode);
    try{ localStorage.setItem('laqyan-mode', mode); }catch(e){}
    document.querySelectorAll('[data-mode-btn]').forEach(b=>{
      const on = b.dataset.modeBtn === mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }
  document.querySelectorAll('[data-mode-btn]').forEach(b=>b.addEventListener('click', ()=>setMode(b.dataset.modeBtn)));
  setMode(root.getAttribute('data-mode') || 'dark');

  /* ================================================================ Selects */
  function fillSelect(el, options, placeholder){
    const keep = el.value;
    el.innerHTML = (placeholder ? '<option value="">'+esc(placeholder)+'</option>' : '') +
      options.map(o => '<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>').join('');
    if([...el.options].some(o => o.value === keep)) el.value = keep;
  }
  function fillSelects(){
    const cats = CATEGORIES.map(c => ({value:c.key, label:c[lang]}));
    const locs = LOCATIONS.map(([ar]) => ({value:ar, label:locLabel(ar)}));
    fillSelect(document.getElementById('categorySelect'), cats, t('filter.allCat'));
    fillSelect(document.getElementById('locationSelect'), locs, t('filter.allLoc'));
    fillSelect(document.getElementById('itemCategory'), cats);
    fillSelect(document.getElementById('itemLocation'), locs);
    fillSelect(document.getElementById('itemSection'), SECTIONS.map(s => ({value:s.key, label:secLabel(s.key)})));
  }

  /* ================================================================ Language switch */
  function setLang(l){
    lang = l === 'en' ? 'en' : 'ar';
    root.setAttribute('lang', lang);
    root.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
    try{ localStorage.setItem('laqyan-lang', lang); }catch(e){}
    applyStatic();

  /* ================================================================ Render list */
  const grid = document.getElementById('grid');

  function currentFilters(){
    return {
      q: document.getElementById('searchInput').value.trim().toLowerCase(),
      cat: document.getElementById('categorySelect').value,
      loc: document.getElementById('locationSelect').value
    };
  }
  // Search in both languages so a query works whatever the interface language is.
  function searchText(it){
    const c = CATEGORIES.find(c => c.key === it.category) || {};
    return [it.name, it.desc, it.en && it.en.name, it.en && it.en.desc, it.location, LOC_EN[it.location], c.ar, c.en]
      .filter(Boolean).join(' ').toLowerCase();
  }

  function stateHTML(){
    return dbState === 'loading'
      ? '<div class="state-box" role="status"><span class="spinner" aria-hidden="true"></span><p>'+esc(t('load.loading'))+'</p></div>'
      : '<div class="state-box" role="alert">'+svg('empty')+'<h3>'+esc(t('load.errorTitle'))+'</h3><p>'+esc(t('load.errorBody'))+'</p>'+
        '<button class="btn btn-ghost btn-sm" type="button" data-retry-load>'+esc(t('load.retry'))+'</button></div>';
  }
  function renderDbState(target){
    target.innerHTML = stateHTML();
    ['countLost','countFound','countMale','countFemale'].forEach(id => { document.getElementById(id).textContent = '-'; });
    document.getElementById('resultsMeta').textContent = t(dbState === 'loading' ? 'load.loading' : 'load.errorTitle');
  }
  document.addEventListener('click', e => { if(e.target.closest('[data-retry-load]')) loadFromDb(); });

  function render(){
    if(dbState !== 'ready'){ renderDbState(grid); return; }
    const {q, cat, loc} = currentFilters();
    const inSection = items.filter(it => it.section === currentSection);
    const all = inSection.filter(it => it.type === currentTab);
    document.getElementById('countLost').textContent = inSection.filter(i=>i.type==='lost').length;
    document.getElementById('countFound').textContent = inSection.filter(i=>i.type==='found').length;
    document.getElementById('countMale').textContent = items.filter(i=>i.section==='male').length;
    document.getElementById('countFemale').textContent = items.filter(i=>i.section==='female').length;

    const filtered = all.filter(it => {
      if(cat && it.category !== cat) return false;
      if(loc && it.location !== loc) return false;
      if(q && !searchText(it).includes(q)) return false;
      return true;
    })
    // Open reports first, newest first; returned items sink to the end (stable sort keeps new reports on top).
    .sort((a, b) => (a.returned ? 1 : 0) - (b.returned ? 1 : 0) || b.date.localeCompare(a.date));

    const meta = document.getElementById('resultsMeta');
    const filtering = !!(q || cat || loc);
    meta.innerHTML = '<strong>'+esc(secLabel(currentSection))+' · '+esc(t(currentTab==='lost' ? 'tab.lost' : 'tab.found'))+'</strong>: '+
      esc(resultsText(filtered.length)) + (filtering ? ' '+esc(t('meta.matching')) : '') +
      (filtering ? ' <button class="link-btn meta-clear" type="button" data-clear-filters>'+svg('x')+esc(t('meta.clear'))+'</button>' : '');

    if(filtered.length === 0){
      grid.innerHTML = '<div class="empty-state">'+
        svg('empty')+
        '<h3>'+esc(t('empty.title'))+'</h3>'+
        '<p>'+esc(t('empty.body'))+'</p>'+
        '<button class="btn btn-ghost btn-sm" id="clearFiltersBtn" type="button" data-clear-filters>'+esc(t('meta.clear'))+'</button>'+
      '</div>';
      return;
    }

    grid.innerHTML = filtered.map(cardHTML).join('');
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.id));
    });
  }

  // Picture for an item: an uploaded photo (fills the frame), else the product illustration (centred).
  function itemPic(it){
    if(it.image) return {src: it.image, cls: 'photo'};
    if(it.illus) return {src: it.illus, cls: 'illus'};
    return null;
  }

  function cardHTML(it, i){
    const pic = itemPic(it);
    const thumb = pic
      ? '<img class="'+pic.cls+'" src="'+esc(pic.src)+'" alt="'+esc(nameOf(it))+'" loading="lazy" onerror="var p=this.parentElement, f=document.getElementById(\'fallback-'+it.id+'\'); this.remove(); if(p&&f) p.insertAdjacentHTML(\'afterbegin\', f.innerHTML);">'
      : '';
    const fallback = '<div class="icon-badge">'+svg(it.category)+'</div>';
    const n = matchesFor(it).length;
    return '<button class="card" type="button" data-id="'+it.id+'" style="--i:'+Math.min(i||0, 10)+'">'+
      '<div class="card-head">'+
        '<div><span class="card-title">'+esc(nameOf(it))+'</span>'+
        '<span class="card-cat">'+esc(catLabel(it.category))+'</span></div>'+
        '<span class="arrow-btn" aria-hidden="true">'+svg('arrow')+'</span>'+
      '</div>'+
      '<div class="card-thumb">'+
        (pic ? thumb : fallback)+
        '<span id="fallback-'+it.id+'" style="display:none">'+fallback+'</span>'+
        '<span class="status-pill '+statusOf(it)+'">'+esc(statusLabel(statusOf(it)))+'</span>'+
      '</div>'+
      '<p class="card-desc">'+esc(descOf(it))+'</p>'+
      '<div class="card-meta">'+
        '<span class="card-meta-row">'+svg('location')+esc(locLabel(it.location))+'</span>'+
        '<span class="card-meta-row">'+svg('calendar')+esc(fmtDate(it.date))+' <span class="ago">· '+esc(daysAgo(it.date))+'</span></span>'+
        (n ? '<span class="card-meta-row match-hint">'+svg('link')+esc(t('card.match', {items: countItems(n), list: t(it.type==='lost' ? 'list.found' : 'list.lost')}))+'</span>' : '')+
      '</div>'+

      '<div class="panel wide"><div class="panel-head"><h3>'+esc(t('panel.sec'))+'</h3><p>'+esc(t('panel.secSub'))+'</p></div>'+
        '<div class="dash-table-wrap"><table class="dash-table"><thead><tr><th>'+esc(t('th.section'))+'</th><th class="num">'+esc(t('th.reports'))+'</th><th class="num">'+esc(t('th.lost'))+'</th><th class="num">'+esc(t('th.found'))+'</th><th class="num">'+esc(t('th.returned'))+'</th><th class="num">'+esc(t('th.rate'))+'</th></tr></thead><tbody>'+

  /* ================================================================ Photo picker
     Photos are shrunk to max 960px JPEG before saving, so they fit in the device storage. */
  const photoInput = document.getElementById('itemPhoto');
  const photoDrop = document.getElementById('photoDrop');
  const photoPreview = document.getElementById('photoPreview');
  const photoImg = document.getElementById('photoImg');
  const photoBusy = document.getElementById('photoBusy');
  let pendingPhoto = '';

  function showPhoto(src){
    pendingPhoto = src || '';
    photoImg.src = pendingPhoto;
    photoPreview.hidden = !pendingPhoto;
    photoDrop.hidden = !!pendingPhoto;
  }
  function shrinkPhoto(file){
    return new Promise((resolve, reject) => {
      if(!file || !/^image\//.test(file.type)) return reject(new Error('not an image'));
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 960 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
      img.src = url;
    });
  }
  async function takePhoto(file){
    const field = document.getElementById('f-photo');
    field.classList.remove('err');
    photoBusy.hidden = false;
    try{ showPhoto(await shrinkPhoto(file)); }
    catch(e){ field.classList.add('err'); }
    finally{ photoBusy.hidden = true; photoInput.value = ''; }
  }
  photoDrop.addEventListener('click', () => photoInput.click());
  document.getElementById('photoChange').addEventListener('click', () => photoInput.click());
  document.getElementById('photoRemove').addEventListener('click', () => showPhoto(''));
  photoInput.addEventListener('change', () => { if(photoInput.files[0]) takePhoto(photoInput.files[0]); });
  ['dragenter','dragover'].forEach(ev => photoDrop.addEventListener(ev, e => { e.preventDefault(); photoDrop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => photoDrop.addEventListener(ev, e => { e.preventDefault(); photoDrop.classList.remove('drag'); }));
  photoDrop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) takePhoto(f); });

  /* ================================================================ Report dialog (new report or admin edit) */
  const reportDialog = document.getElementById('reportDialog');
  const reportForm = document.getElementById('reportForm');
  let editingId = null;

  function setReportTexts(){
    const type = document.getElementById('reportType').value;
    document.getElementById('reportDialogTitle').textContent = t(editingId ? 'form.editTitle' : type === 'lost' ? 'form.lostTitle' : 'form.foundTitle');
    document.getElementById('submitReportBtn').textContent = t(editingId ? 'form.save' : type === 'lost' ? 'form.submitLost' : 'form.submitFound');
  }
  let submitBusy = false;
  function setSubmitBusy(on){
    submitBusy = on;
    const b = document.getElementById('submitReportBtn');
    b.disabled = on;
    b.setAttribute('aria-busy', on ? 'true' : 'false');

  function showFormError(msg){
    const el = document.getElementById('formError');
    el.textContent = msg || '';
    el.hidden = !msg;
  }
  function openReport(type, editItem){
    reportForm.reset();
    showFormError('');
    editingId = editItem ? editItem.id : null;
    document.getElementById('reportType').value = editItem ? editItem.type : type;
    document.getElementById('itemSection').value = editItem ? editItem.section : currentSection;
    document.getElementById('itemDate').value = editItem ? editItem.date : todayISO();
    document.getElementById('itemDate').max = todayISO();
    if(editItem){
      document.getElementById('itemName').value = nameOf(editItem);

      document.getElementById('itemContact').value = editItem.contact;
    }
    showPhoto(editItem ? editItem.image : '');

  ['btnReportLostHeader','btnReportLostMobile'].forEach(id=>document.getElementById(id).addEventListener('click', ()=>openReport('lost')));
  ['btnReportFoundHeader','btnReportFoundMobile','btnReportFoundSide'].forEach(id=>document.getElementById(id).addEventListener('click', ()=>openReport('found')));

  reportForm.addEventListener('submit', async function(e){
    e.preventDefault();
    if(submitBusy) return;
    showFormError('');
    const fields = {
      name: document.getElementById('itemName'),
      section: document.getElementById('itemSection'),
      category: document.getElementById('itemCategory'),
      location: document.getElementById('itemLocation'),
      desc: document.getElementById('itemDesc'),
      date: document.getElementById('itemDate'),
      contact: document.getElementById('itemContact')
    };
    let valid = true;
    Object.entries(fields).forEach(([key, el])=>{
      const fieldEl = document.getElementById('f-'+key);
      let ok = el.value.trim().length > 0;
      if(ok && key === 'contact') ok = validContact(el.value);
      if(ok && key === 'date') ok = el.value <= todayISO();
      if(fieldEl) fieldEl.classList.toggle('err', !ok);
      if(!ok) valid = false;
    });
    if(!valid){ const first = reportForm.querySelector('.field.err input, .field.err select, .field.err textarea'); if(first) first.focus(); return; }

    const values = {
      section: fields.section.value,
      name: fields.name.value.trim(),
      category: fields.category.value,
      location: fields.location.value,
      date: fields.date.value,
      desc: fields.desc.value.trim(),
      contact: fields.contact.value.trim(),
      image: pendingPhoto
    };

    if(editingId){                                   // admin edit
      const it = items.find(i => i.id === editingId);
      if(!it || !isAdmin()) return;
      const changedText = values.name !== nameOf(it) || values.desc !== descOf(it);
      if(useDb){
        const patch = valuesToRow(values);
        if(changedText){ patch.name_en = null; patch.description_en = null; }   // edited text replaces both languages
        setSubmitBusy(true);
        const r = await adminRpc('admin_update_item', {p_id: it.id, p_item: patch});
        setSubmitBusy(false);
        if(!r.ok){ showFormError(t('err.save')); return; }
        Object.assign(it, rowToItem(r.data));
      }else{
        Object.assign(it, values);
        if(changedText) delete it.en;                // edited text replaces both languages
        if(!saveItems()) return;
      }
      reportDialog.close();
      editingId = null;
      setSection(it.section); setTab(it.type);
      openDetail(it.id);
      toast(t('toast.saved'));
      return;

    const type = document.getElementById('reportType').value;
    let newItem;
    if(useDb){
      setSubmitBusy(true);

        .insert(Object.assign({report_type: type}, valuesToRow(values))).select().single();

      newItem = rowToItem(data);

  function downloadCsv(){
    const q = v => '"'+String(v).replace(/"/g,'""')+'"';
    const rows = [[t('col.section'), t('col.type'), t('col.status'), t('col.name'), t('col.category'), t('col.location'), t('col.date'), t('col.returnedDate'), t('col.desc')]];
    reportGroups().forEach(g=>{
      [['lost',g.lost],['found',g.found]].forEach(([type,list])=>{
        list.forEach(it=> rows.push([secLabel(g.section.key), statusLabel(type), statusLabel(statusOf(it)), nameOf(it), catLabel(it.category), locLabel(it.location), it.date, it.returnedDate||'', descOf(it)]));
      });
    });
    // BOM so Excel opens the Arabic text as UTF-8.
    const csv = '﻿' + rows.map(r=>r.map(q).join(',')).join('\r\n');
    const filename = t('rp.file')+stamp()+'.csv';
    // Inside the claude.ai viewer a page can't download directly; it offers the file through the
    // `downloads` capability (the viewer confirms). Opened as a plain file, use a normal download.
    if(downloadsCap){
      downloadsCap.save({filename, data: csv})
        .then(() => toast(t('toast.csv')))
        .catch(() => {});                          // declined or unavailable: nothing to do
      return;
    }
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(t('toast.csv'));
  }

  /* ================================================================ Guided tour
     Shown once per role on this device (then from «جولة تعريفية»). Each step spotlights the
     first visible target; the welcome step has none. */
  const tourEl = document.getElementById('tour');
  const tourSpot = document.getElementById('tourSpot');
  const tourCard = document.getElementById('tourCard');
  let tourOn = false, tourIndex = 0, tourSteps = [];
  const TOUR_STUDENT = [
    {key:'0'},
    {key:'1', sel:['.section-card']},
    {key:'2', sel:['.nav-card .tabs']},
    {key:'3', sel:['.filters']},
    {key:'4', sel:['.top-actions', '.mobile-cta']},
    {key:'5', sel:['#grid .card']}
  ];
  const TOUR_ADMIN = [ {key:'a1', sel:['#navDash']}, {key:'a2', sel:['.report-wrap']} ];
  function tourSeen(role){ try{ return localStorage.getItem('laqyan-tour-'+role) === '1'; }catch(e){ return true; } }
  function tourTarget(step){
    for(const s of (step.sel || [])){
      const el = document.querySelector(s);
      if(el && el.offsetWidth > 0 && getComputedStyle(el).display !== 'none') return el;
    }
    return null;
  }
  function startTour(){
    if(!currentRole()) return;
    document.querySelectorAll('dialog[open]').forEach(d=>d.close());
    if(currentView !== 'list') setView('list');
    tourSteps = TOUR_STUDENT.concat(isAdmin() ? TOUR_ADMIN : []);
    tourOn = true; tourIndex = 0;
    tourEl.hidden = false;
    showTourStep(0);
    document.getElementById('tourNext').focus();
  }
  function endTour(remember){
    if(!tourOn) return;
    tourOn = false; tourEl.hidden = true;
    if(remember !== false){ try{ localStorage.setItem('laqyan-tour-'+currentRole(), '1'); }catch(e){} }
  }
  function placeTour(){
    if(!tourOn) return;
    const step = tourSteps[tourIndex];
    const target = tourTarget(step);
    const cw = tourCard.offsetWidth, ch = tourCard.offsetHeight, pad = 8, gap = 14, vw = window.innerWidth, vh = window.innerHeight;
    if(!target){
      tourSpot.classList.add('none');
      tourCard.style.left = Math.round((vw - cw)/2)+'px';
      tourCard.style.top = Math.round((vh - ch)/2)+'px';
      return;
    }
    tourSpot.classList.remove('none');
    const r = target.getBoundingClientRect();
    tourSpot.style.left = (r.left - pad)+'px'; tourSpot.style.top = (r.top - pad)+'px';
    tourSpot.style.width = (r.width + pad*2)+'px'; tourSpot.style.height = (r.height + pad*2)+'px';
    let top = r.bottom + pad + gap;
    if(top + ch > vh - 12) top = r.top - pad - gap - ch;           // not enough room below: go above
    if(top < 12) top = Math.min(vh - ch - 12, Math.max(12, r.top + 12));
    const left = Math.min(vw - cw - 12, Math.max(12, r.left + r.width/2 - cw/2));
    tourCard.style.left = Math.round(left)+'px'; tourCard.style.top = Math.round(top)+'px';
  }
  function showTourStep(i){
    tourIndex = Math.max(0, Math.min(tourSteps.length - 1, i));
    const step = tourSteps[tourIndex], last = tourIndex === tourSteps.length - 1;
    document.getElementById('tourStep').textContent = t('tour.step', {i: tourIndex + 1, n: tourSteps.length});
    document.getElementById('tourTitle').textContent = t('tour.'+step.key+'t');
    document.getElementById('tourBody').textContent = t('tour.'+step.key+'b');
    document.getElementById('tourNext').textContent = t(last ? 'tour.done' : 'tour.next');
    document.getElementById('tourPrev').hidden = tourIndex === 0;
    document.getElementById('tourDots').innerHTML = tourSteps.map((_, k) => '<i class="'+(k === tourIndex ? 'on' : '')+'"></i>').join('');
    const target = tourTarget(step);
    if(target) target.scrollIntoView({block:'center', behavior:'instant'});
    requestAnimationFrame(placeTour);
  }
  document.getElementById('tourNext').addEventListener('click', () => tourIndex >= tourSteps.length - 1 ? endTour() : showTourStep(tourIndex + 1));
  document.getElementById('tourPrev').addEventListener('click', () => showTourStep(tourIndex - 1));
  document.getElementById('tourSkip').addEventListener('click', () => endTour());
  document.getElementById('btnTour').addEventListener('click', startTour);
  window.addEventListener('resize', placeTour);

  document.addEventListener('keydown', (e) => {
    if(!tourOn) return;
    const fwd = lang === 'en' ? 'ArrowRight' : 'ArrowLeft', back = lang === 'en' ? 'ArrowLeft' : 'ArrowRight';
    if(e.key === 'Escape') endTour();
    else if(e.key === fwd) document.getElementById('tourNext').click();
    else if(e.key === back && tourIndex > 0) showTourStep(tourIndex - 1);

  /* ================================================================ Glow follows the pointer */
  let glowEl = null;
  function glowTarget(node){
    if(!node || !node.closest) return null;
    return node.closest('dialog, .card, .side-card, .gate-card, .kpi, .panel');
  }
  function glowOff(el){
    if(!el) return;
    ['--mx','--my','--ga','--gw'].forEach(p=>el.style.removeProperty(p));
  }
  document.addEventListener('pointermove', (e)=>{
    const el = glowTarget(e.target);
    if(el !== glowEl){ glowOff(glowEl); glowEl = el; }
    if(!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', Math.max(0, Math.min(r.width, e.clientX - r.left)) + 'px');
    el.style.setProperty('--my', Math.max(0, Math.min(r.height, e.clientY - r.top)) + 'px');
    el.style.setProperty('--ga', '1');
    el.style.setProperty('--gw', '190px');
