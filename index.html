  /* ================================================================ Chat assistant (مساعد لقيان)
     The browser only sends the message + recent turns to the chat-assistant Edge Function
     (supabase/functions/chat-assistant); the Gemini key and the DB secret key stay on the server.
     The conversation lives in memory only and is cleared on sign-out. */
  const chatFab = document.getElementById('chatFab');
  const chatPanel = document.getElementById('chatPanel');
  const chatLog = document.getElementById('chatLog');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const CHAT_TURNS = 10, CHAT_TIMEOUT = 90000;
  let chatHistory = [];            // [{role:'user'|'model', text}]
  let chatBusy = false;

  function chatScroll(){ chatLog.scrollTop = chatLog.scrollHeight; }
  function chatAdd(node){ chatLog.appendChild(node); chatScroll(); return node; }
  function chatEl(tag, cls, html){ const el = document.createElement(tag); el.className = cls; if(html != null) el.innerHTML = html; return el; }
  // Message text -> safe HTML: paragraphs, "- " / "1. " lists, **bold**, tappable phone numbers and emails.
  function chatInline(s){
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\d])(05\d{8})(?!\d)/g, '$1<a href="tel:$2" dir="ltr">$2</a>')
      .replace(/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/g, '<a href="mailto:$1" dir="ltr">$1</a>');
  }
  function chatText(s){
    let html = '', list = null;
    const close = () => { if(list){ html += '</' + list + '>'; list = null; } };
    String(s).replace(/\r/g, '').split('\n').forEach(raw => {
      const line = raw.trim(); let m;
      if((m = line.match(/^[-*•]\s+(.+)$/)) || (m = line.match(/^\d+[.)]\s+(.+)$/))){
        const kind = /^\d/.test(line) ? 'ol' : 'ul';
        if(list !== kind){ close(); html += '<' + kind + '>'; list = kind; }
        html += '<li>' + chatInline(m[1]) + '</li>';
      }else{
        close();
        if(line) html += '<p>' + chatInline(line) + '</p>';
      }
    });
    close();
    return html;
  }
  function chatBubble(role, text, extraCls){
    const el = chatEl('div', 'msg ' + role + (extraCls ? ' ' + extraCls : ''), chatText(text));
    el.dir = 'auto';
    return chatAdd(el);
  }
  function chatItemCard(it){
    const pic = itemPic(it);
    const b = chatEl('button', 'chat-item',
      '<span class="ci-pic">' + (pic ? '<img class="'+pic.cls+'" src="'+esc(pic.src)+'" alt="" onerror="this.remove()">' : svg(it.category in ICONS ? it.category : 'other')) + '</span>' +
      '<span class="ci-text"><strong>' + esc(nameOf(it)) + '</strong><small class="ci-status">' + esc(statusLabel(statusOf(it))) + '</small>' +
        '<small>' + esc(locLabel(it.location)) + ' · ' + esc(fmtDate(it.date)) + '</small></span>' +
      '<span class="ci-open">' + esc(t('chat.openItem')) + '</span>');
    b.type = 'button';
    b.addEventListener('click', () => openDetail(it.id));
    return b;
  }
  function chatWelcome(){
    chatBubble('bot', t('chat.welcome'));
    const box = chatEl('div', 'chat-suggest');
    ['chat.s1', 'chat.s2', 'chat.s3'].forEach(k => {
      const c = chatEl('button', 'chat-chip'); c.type = 'button'; c.textContent = t(k); c.dir = 'auto';
      c.addEventListener('click', () => { box.remove(); sendChat(c.textContent); });
      box.appendChild(c);
    });
    chatAdd(box);
  }
  function openChat(){
    chatPanel.hidden = false;
    chatFab.setAttribute('aria-expanded', 'true');
    if(!chatLog.childElementCount) chatWelcome();
    chatScroll();
    chatInput.focus();
  }
  function closeChat(){
    chatPanel.hidden = true;
    chatFab.setAttribute('aria-expanded', 'false');
    chatFab.focus();
  }
  function resetChat(){
    chatHistory = []; chatLog.innerHTML = '';
    chatPanel.hidden = true; chatFab.setAttribute('aria-expanded', 'false');
  }
  function setChatBusy(on){ chatBusy = on; chatSend.disabled = on; }

  async function callAssistant(message){
    const history = chatHistory.slice(-CHAT_TURNS);
    const call = sb.functions.invoke('chat-assistant', {body: {message, history, section: currentSection}});
    const timeout = new Promise(resolve => setTimeout(() => resolve({timeout: true}), CHAT_TIMEOUT));
    const res = await Promise.race([call, timeout]);
    if(res.timeout) return {error: 'network'};
    if(res.error){
      // Non-2xx: the function still sends a JSON body with a friendly reply when it can.
      try{ const body = await res.error.context.json(); if(body && body.reply) return body; }catch(e){}
      console.error('LaqYan: chat-assistant failed', res.error);
      return {error: 'network'};
    }
    return res.data || {error: 'network'};
  }

  async function sendChat(text){
    text = String(text || '').trim();
    if(!text || chatBusy) return;
    chatLog.querySelectorAll('.chat-suggest, .msg-retry').forEach(el => el.remove());
    const userEl = chatBubble('user', text);
    if(!useDb){ chatBubble('bot', t('chat.offline'), 'error'); return; }

    setChatBusy(true);
    const typing = chatAdd(chatEl('div', 'msg bot chat-typing', '<span class="dots"><i></i><i></i><i></i></span><span class="typing-label"></span>'));
    const typingLabel = typing.querySelector('.typing-label');
    typingLabel.textContent = t('chat.searching');
    const typingTimer = setTimeout(() => { typingLabel.textContent = t('chat.thinking'); }, 6000);
    let data;
    try{ data = await callAssistant(text); }catch(e){ console.error('LaqYan: chat-assistant failed', e); data = {error: 'network'}; }
    clearTimeout(typingTimer);
    typing.remove();
    setChatBusy(false);

    const failed = !!data.error && !data.created;
    const bubble = chatBubble('bot', data.reply || t('chat.errNet'), failed ? 'error' : '');
    if(failed){
      // Not added to history, so the retry sends the same message again.
      const retry = chatEl('button', 'btn btn-ghost btn-sm msg-retry'); retry.type = 'button';
      retry.textContent = t('chat.retry');
      retry.addEventListener('click', () => { bubble.remove(); userEl.remove(); sendChat(text); });
      bubble.appendChild(retry);
      return;
    }
    chatHistory.push({role: 'user', text}, {role: 'model', text: data.reply});

    if(data.created){
      // Same result as posting through the report form: into the list, shown under "المفقودات".
      const it = rowToItem(data.created);
      if(!items.some(i => i.id === it.id)) items.unshift(it);
      setSection(it.section); setTab('lost');
      const ok = chatEl('div', 'chat-success', '<span class="tick">'+svg('check')+'</span>' + esc(t('chat.created')));
      chatAdd(ok);
      chatAdd(chatEl('div', 'chat-items')).appendChild(chatItemCard(it));
      toast(t('toast.postedLost'));
      loadFromDb(true);
    }
    const shown = (data.items || []).map(id => items.find(i => i.id === id)).filter(Boolean);
    if(shown.length){
      const list = chatAdd(chatEl('div', 'chat-items'));
      shown.forEach(it => list.appendChild(chatItemCard(it)));
    }
    chatScroll();
  }

  chatFab.addEventListener('click', openChat);
  document.getElementById('chatClose').addEventListener('click', closeChat);
  chatPanel.addEventListener('keydown', e => { if(e.key === 'Escape'){ e.stopPropagation(); closeChat(); } });
  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = chatInput.value;
    if(!text.trim() || chatBusy) return;
    chatInput.value = ''; chatInput.style.height = '';
    sendChat(text);
  });
  chatInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); chatForm.requestSubmit(); }
  });
  chatInput.addEventListener('input', () => {      // grow with the text, up to the CSS max-height
    chatInput.style.height = ''; chatInput.style.height = Math.min(chatInput.scrollHeight + 2, 120) + 'px';
  });

    loadFromDb().then(ok => { if(ok) openFromHash(); });
    // Pick up reports added from other devices when the tab comes back into view.
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden && dbState === 'ready' && Date.now() - lastLoad > 15000 && !document.querySelector('dialog[open]')) loadFromDb(true);
    });
  }else openFromHash();
})();
</script>
